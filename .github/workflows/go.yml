name: Go

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: swosh
          POSTGRES_PASSWORD: swosh
          POSTGRES_DB: swosh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swosh -d swosh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SWOSH_TEST_DATABASE_URL: postgres://swosh:swosh@localhost:5432/swosh?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          # `git describe` in the Makefile needs the tags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('go.mod', 'Makefile') }}

      - run: make tools
      - run: make generate-check
      - run: make lint
      - run: make test
      - run: make build

  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # Tags the commit and creates a GitHub release when the Conventional
    # Commits since the last v* tag call for one (.releaserc.json).
    permissions:
      contents: write

    # The tag semantic-release made (from @semantic-release/exec's successCmd),
    # empty when there was no release.
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: release
        run: >-
          npx --yes
          -p semantic-release@26.0.0-beta.5
          -p conventional-changelog-conventionalcommits@10.4.1
          -p @semantic-release/exec@7.1.0
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm says the 26 beta doesn't meet exec's semantic-release >=24.1.0
          # peer range, as prereleases never match it. It works fine.
          npm_config_legacy_peer_deps: "true"

  image:
    name: Build and push the image
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # VERSION in the Makefile comes from `git describe`, and IMAGE_TAGS
          # picks up the release job's tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # With KO_DOCKER_REPO unset, this logs in to ghcr.io with GITHUB_TOKEN
      # and sets KO_DOCKER_REPO to ghcr.io/edholm/swosh.
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1 # KO_VERSION in the Makefile

      # Tags the image with the short commit SHA, the release version if this
      # commit has one, and latest.
      - run: make image-push KO=ko

  deploy:
    name: Deploy
    # Only releases are deployed, by the tag semantic-release made.
    needs: [release, image]
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
