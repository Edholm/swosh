version: 2

# One weekly PR for all ecosystems, as chore(deps): …, which the release job
# turns into a patch release (.releaserc.json).
multi-ecosystem-groups:
  deps:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: deps
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: deps
    commit-message:
      prefix: chore
      include: scope
