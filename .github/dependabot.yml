version: 2

# One weekly PR for all ecosystems, as chore(deps): …, which the release job
# turns into a patch release (.releaserc.json).
multi-ecosystem-groups:
  deps:
    schedule:
      interval: weekly
    # Dependabot adds the colon after a prefix that ends in ")".
    commit-message:
      prefix: chore(deps)

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: deps

  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: deps
