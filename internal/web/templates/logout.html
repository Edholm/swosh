<!DOCTYPE html>
<html lang="{{lang}}"{{with theme}} data-theme="{{.}}"{{end}}>
<head>
    <title>{{t "logout.title"}} · Swosh</title>
    {{template "head"}}
</head>
<body>
<header class="container topbar">
    {{template "brand"}}
</header>

<main class="container center-page">
    <div class="card narrow-card">
        <span class="icon-badge">{{template "icon" "log-out"}}</span>
        <h1>{{t "logout.heading"}}</h1>
        <p>{{t "logout.text"}}</p>
        <form method="post" action="/logout" class="form-actions">
            <a href="/admin" class="btn btn-ghost">{{template "icon" "arrow-left"}} {{t "logout.back"}}</a>
            <button type="submit" class="btn btn-primary">{{template "icon" "log-out"}} {{t "logout.submit"}}</button>
        </form>
    </div>
</main>
</body>
</html>
