<!DOCTYPE html>
<html lang="en">
<head>
    <title>Log out · Swosh</title>
    {{template "head"}}
</head>
<body>
<header class="container topbar">
    {{template "brand"}}
</header>

<main class="container center-page">
    <div class="card narrow-card">
        <span class="icon-badge">{{template "icon" "log-out"}}</span>
        <h1>Log out?</h1>
        <p>You will have to sign in again to get back to the admin pages.</p>
        <form method="post" action="/logout" class="form-actions">
            <a href="/admin" class="btn btn-ghost">{{template "icon" "arrow-left"}} Back</a>
            <button type="submit" class="btn btn-primary">{{template "icon" "log-out"}} Log out</button>
        </form>
    </div>
</main>
</body>
</html>
