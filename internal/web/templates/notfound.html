<!DOCTYPE html>
<html lang="en">
<head>
    <title>Link not found · Swosh</title>
    {{template "head"}}
</head>
<body>
<header class="container topbar">
    {{template "brand"}}
</header>

<main class="container center-page">
    <div class="card narrow-card notfound">
        <img class="illustration" src="/img/notfound.svg" alt="" width="240" height="160">
        <h1>Link not found</h1>
        <p>This Swosh link doesn't exist or has expired. Ask whoever sent it for a new one.</p>
        <a href="/" class="btn btn-primary btn-block">{{template "icon" "plus"}} Create a new Swosh</a>
    </div>
</main>

{{template "footer"}}
</body>
</html>
