<!DOCTYPE html>
<html lang="{{lang}}"{{with theme}} data-theme="{{.}}"{{end}}>
<head>
    <title>{{t "notfound.title"}} · Swosh</title>
    {{template "head"}}
</head>
<body>
<header class="container topbar">
    {{template "brand"}}
</header>

<main class="container center-page">
    <div class="card narrow-card notfound">
        <img class="illustration" src="/img/notfound.svg" alt="" width="240" height="160">
        <h1>{{t "notfound.title"}}</h1>
        <p>{{t "notfound.text"}}</p>
        <a href="/" class="btn btn-primary btn-block">{{template "icon" "plus"}} {{t "notfound.new"}}</a>
    </div>
</main>

{{template "footer"}}
</body>
</html>
