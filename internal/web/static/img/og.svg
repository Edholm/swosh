<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The source of og.png, the share image for the front page. Render it at
       1200x630 in a browser, e.g. headless Chrome's screenshot; ImageMagick's
       own SVG renderer drops the gradients. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset=".55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="trail" x1="420" y1="560" x2="1020" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="icontrail" x1="10" y1="54" x2="44" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".75"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M330 700 Q390 250 1000 130 L1010 370 Q620 370 330 700 Z" fill="url(#trail)"/>
  <circle cx="1005" cy="250" r="120" fill="#fff"/>
  <circle cx="1005" cy="250" r="71" fill="none" stroke="#3b82f6" stroke-width="27"/>

  <g transform="translate(96 96) scale(1.5)">
    <rect width="64" height="64" rx="15" fill="url(#icon)"/>
    <path d="M10 54 Q12 21 43 10 L45 30 Q22 30 10 54 Z" fill="url(#icontrail)"/>
    <circle cx="44" cy="20" r="11" fill="#fff"/>
    <circle cx="44" cy="20" r="6.5" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  </g>
  <text x="212" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56"
        font-weight="800" fill="#fff" letter-spacing="-1.5">Swosh</text>

  <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" fill="#fff"
        font-size="92" letter-spacing="-3.5">
    <tspan x="96" y="350">Get paid back</tspan>
    <tspan x="96" y="452">in one tap.</tspan>
  </text>
  <text x="96" y="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34"
        font-weight="500" fill="#fff" fill-opacity=".82">Short links that open Swish with everything filled in.</text>
</svg>
