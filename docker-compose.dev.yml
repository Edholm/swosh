# Postgres for local development and tests, in the swosh-dev compose project.
# Start it with `make db-up`. Deployment uses docker-compose.yml.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: swosh
      POSTGRES_PASSWORD: swosh
      POSTGRES_DB: swosh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
